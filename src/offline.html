<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="wuld-search" content="exclude">
  <meta name="theme-color" content="#0a0a0a">
  <title>Offline — WULD</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; background: #0a0a0a; color: #f0ebe5; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem calc(1.5rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
      box-sizing: border-box;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; width: 100%; }
    .mark {
      font: 700 2.4rem/1 Georgia, "Times New Roman", serif;
      letter-spacing: 0.06em;
      color: #f0ebe5;
      margin: 0 0 1.4rem;
    }
    .mark::after { content: "."; color: #c41e3a; }
    .rule { height: 1px; background: #c41e3a; width: 3.5rem; margin: 0 0 1.4rem; }
    h1 {
      font: 600 0.82rem/1.4 inherit;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8a8580;
      margin: 0 0 0.9rem;
    }
    p { font-size: 1.02rem; line-height: 1.65; margin: 0 0 1.5rem; color: #cfc9c1; }
    .accent { color: #f0ebe5; }
    a.retry {
      display: inline-block;
      font: 600 0.78rem/1.4 inherit;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f0ebe5;
      text-decoration: none;
      background: #0a0a0a;
      border: 1px solid #c41e3a;
      padding: 0.7rem 1.2rem;
      min-height: 44px;
      box-sizing: border-box;
    }
    a.retry:hover, a.retry:focus-visible { background: #c41e3a; color: #0a0a0a; }
  </style>
</head>
<body>
  <main>
    <div class="mark">WULD</div>
    <div class="rule"></div>
    <h1>Offline</h1>
    <p>You&rsquo;re offline&nbsp;&mdash;&nbsp;<span class="accent">cached pages are available</span>; reconnect for the rest.</p>
    <a class="retry" href="/" onclick="location.reload();return false;">Try again</a>
  </main>
</body>
</html>
