<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}wuld-gui{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Neobrutalist dark mode, mono register. Loosely echoes wuld.ink chrome. */
    :root {
      --bg: #0a0a0a;
      --fg: #f0ebe5;
      --muted: #8a8580;
      --accent: #c41e3a;
      --border: #2a2825;
      --field-bg: #141210;
      --ok: #7ab97a;
      --err: #ff6060;
      --diff-add: #1a3a1a;
      --diff-del: #3a1a1a;
      --mono: "IBM Plex Mono", "JetBrains Mono", "Consolas", "Menlo", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font-family: var(--mono); font-size: 14px; line-height: 1.5;
    }
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: var(--accent); }
    header.app-header {
      border-block-end: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex; align-items: baseline; gap: 1.5rem;
    }
    header.app-header h1 {
      font-size: 1rem; margin: 0; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--accent);
    }
    header.app-header nav a { margin-inline-end: 1rem; font-size: 0.85rem; color: var(--muted); }
    header.app-header nav a:hover { color: var(--fg); }
    main { padding: 2rem; max-width: 64rem; margin-inline: auto; }
    h2 { font-size: 1.05rem; margin-block: 1.5rem 0.5rem; letter-spacing: 0.02em; color: var(--accent); text-transform: uppercase; }
    h3 { font-size: 0.95rem; margin-block: 1.25rem 0.5rem; }
    p { margin-block: 0.5rem; }
    .blurb { color: var(--muted); font-size: 0.85rem; }
    .ops-grid { display: grid; gap: 0.75rem; }
    .op-card {
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: block; text-decoration: none;
    }
    .op-card:hover { border-color: var(--accent); color: var(--fg); }
    .op-card .op-title { font-weight: 600; color: var(--fg); }
    .op-card .op-blurb { color: var(--muted); font-size: 0.8rem; margin-block-start: 0.25rem; }
    form { display: grid; gap: 1rem; max-width: 50rem; }
    label { display: block; }
    label .lbl-text { display: block; font-size: 0.85rem; color: var(--muted); margin-block-end: 0.25rem; }
    label .lbl-help { display: block; font-size: 0.75rem; color: var(--muted); margin-block-start: 0.2rem; opacity: 0.7; }
    input[type=text], textarea, select {
      width: 100%; padding: 0.6rem 0.7rem;
      background: var(--field-bg); color: var(--fg);
      border: 1px solid var(--border); font-family: var(--mono); font-size: 0.85rem;
    }
    textarea { min-height: 5rem; resize: vertical; }
    input[type=text]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    input[type=checkbox] { vertical-align: middle; }
    button, input[type=submit] {
      padding: 0.6rem 1.2rem; background: var(--accent); color: var(--bg);
      border: 1px solid var(--accent); font-family: var(--mono); font-size: 0.85rem;
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
    }
    button.secondary, input[type=submit].secondary {
      background: transparent; color: var(--fg); border-color: var(--border);
    }
    button:hover, input[type=submit]:hover { filter: brightness(1.1); }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .alert {
      padding: 0.75rem 1rem;
      border-inline-start: 3px solid var(--accent);
      background: var(--field-bg);
      margin-block-end: 1rem; font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .alert.error { border-inline-start-color: var(--err); color: var(--err); }
    .diff {
      background: var(--field-bg); border: 1px solid var(--border);
      padding: 0.75rem 1rem; overflow-x: auto;
      font-size: 0.8rem; line-height: 1.45;
      max-height: 30rem;
      white-space: pre; tab-size: 4;
    }
    .diff .add { background: var(--diff-add); }
    .diff .del { background: var(--diff-del); }
    pre.log {
      background: var(--field-bg); border: 1px solid var(--border);
      padding: 0.75rem 1rem; overflow-x: auto; font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .meta-row { color: var(--muted); font-size: 0.8rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>wuld-gui</h1>
    <nav>
      <a href="{{ url_for('index') }}">ops</a>
      <a href="{{ url_for('status') }}">git status</a>
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="alert {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
